<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<title>Graphite</title>
		<style>
			/* Todo el fondo negro ANTES de que llegue el bundle. El motor pinta
			   un gris muy oscuro (39,39,39) como fondo del lienzo, así que un
			   blanco de fondo haría un flash blanco al arrancar que dura lo que
			   tarda el wasm en inicializarse. */
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				overflow: hidden;
				background: #0a0a0a;
				overscroll-behavior: none;
				/* Sin selección de texto: es un editor gráfico, y en un móvil
				   seleccionar arrastrando es Molesto y además dispara el menú de
				   copiar/pegar sin querer. */
				-webkit-user-select: none;
				user-select: none;
				-webkit-touch-callout: none;
				/* Sin rebote de scroll: el frontend gestiona su propio scroll, y
				   el rebote del navegador lo descoloca. */
				touch-action: none;
			}
		</style>
	</head>
	<body>
		<!--
			EL CSS. MEDIDO: sin este `<link>`, la UI arranca pero SIN estilos.

			Vite saca el CSS del bundle y lo mete aquí, en el `index.html` que él
			genera. Pero este `index.html` es NUESTRO, versionado en el repo, y
			reemplaza al de vite. Con lo cual el `<link>` se queda en el fichero
			de vite que nadie mira, y el CSS no se carga nunca.

			No hay forma de que el bundle lo pida: no lo menciona. Se comprueba
			buscando `style.css` dentro del bundle y no aparece (lo que aparece es
			`e.style.cssText`, que es otra cosa).

			`href="./style.css"` es RELATIVO a propósito: la pagina se sirve en
			`.../assets/web/index.html`, asi que resuelve a `.../assets/web/style.css`,
			que es donde lo deja el workflow. Las rutas ABSOLUTAS del bundle
			(`/assets/glue.wasm`) las resuelve el `WebViewAssetLoader`.
		-->
		<link rel="stylesheet" href="./style.css" />

		<!--
			El bundle que produce `vite build --mode native` es
			`assets/index-<hash>.js`, renombrado a `bundle.js` por el workflow.
			Ese workflow lo reescribe con el nombre real al preparar los assets,
			así que aquí no hay ningún hash.

			`type="module"` NO es opcional. MEDIDO: sin él, el WebView lanza

			    Uncaught SyntaxError: Cannot use 'import.meta' outside a module

			y el frontend no arranca. Vite emite el bundle como ES module porque
			usa `import.meta.url` para resolver el `.wasm` con `new URL(...)`, que
			es justo el mecanismo con el que encuentra su propio binario. Un
			`<script>` normal no puede usar `import.meta`.

			Con `WebViewAssetLoader` los módulos ya no dan problemas de CORS, porque
			la página se sirve por `https` con un origen real.
		-->
		<script type="module" src="./bundle.js"></script>
	</body>
</html>
