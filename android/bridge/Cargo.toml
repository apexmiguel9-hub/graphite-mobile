[package]
name = "graphite-android-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# El nombre lleva `_android` porque es lo que espera el nombre de la librería
# nativa; el paquete se llama distinto a propósito, para que `cargo build -p`
# no lo confunda con un crate del workspace de upstream.
name = "graphite_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
# ------------------------------------------------------------------
# EL MOTOR, por ruta. Esto es todo el port: no se copia código del motor,
# se depende de él. Si algún día upstream cambia una de estas API, el sitio
# que se rompe es este fichero, no el motor.
# ------------------------------------------------------------------
graphite-editor = { path = "../../editor" }

# ------------------------------------------------------------------
# EL WRAPPER DE ESCRITORIO: la pieza clave de esta fase.
#
# `desktop/wrapper` es el Rust que hay ENTRE el frontend y el motor, y es
# agnóstico de plataforma: el escritorio lo usa dentro de CEF y aquí se usa
# igual. Contiene el dispatcher de mensajes y las dos funciones de la frontera:
#
#   deserialize_editor_message   <->  graphite_editor::Message
#   serialize_frontend_messages  <->  Vec<FrontendMessage>
#
# Reutilizarlo es lo que hace este port barato. Reescribir el dispatcher son
# ~150 líneas de lógica de mensajes que upstream ya tiene probadas en
# producción, y que habría que mantener sincronizadas con el motor para siempre.
#
# A su vez, `desktop/wrapper` depende de `frontend/wrapper` —el crate del
# frontend— como `rlib` NATIVA, con `default-features = false, features =
# ["editor"]`. Ese es el truco que lo hace posible: el formato de los mensajes
# está escrito una sola vez y funciona igual dentro y fuera del wasm.
# ------------------------------------------------------------------
graphite-desktop-wrapper = { path = "../../desktop/wrapper" }
graph-craft = { path = "../../node-graph/graph-craft" }
wgpu-executor = { path = "../../node-graph/libraries/wgpu-executor" }
wgpu-sync = { path = "../../libraries/wgpu-sync" }
document-container = { path = "../../document/container" }
document-graph-storage = { path = "../../document/graph-storage" }
document-format = { path = "../../document/format" }
graphene-application-io = { path = "../../node-graph/libraries/application-io" }
graphene-std = { path = "../../node-graph/nodes/gstd" }
interpreted-executor = { path = "../../node-graph/interpreted-executor" }
dyn-any = { path = "../../libraries/dyn-any" }
math-parser = { path = "../../libraries/math-parser" }

# Versiones: las mismas que declara el workspace de upstream en
# `[workspace.dependencies]`. Si upstream las mueve, este fichero es el que hay
# que tocar, y se nota enseguida porque el motor y el puente dejarían de
# compilar juntos.
wgpu = "29.0"
pollster = "0.4"
ndk = { version = "0.8", features = ["rwh_06", "api-level-26"] }
raw-window-handle = "0.6"
jni = "0.21"
log = "0.4"
android_logger = "0.13"

# ------------------------------------------------------------------
# `bytemuck`, y solo para `cast_slice`.
#
# Para escribir 16 bytes en un uniform buffer hace falta una &[u8] con el
# `size_of` de lo que se escribe. Se podría hacer a mano con un array de bytes y
# `to_le_bytes`, que es lo que hace `base64_encode` de este mismo crate; pero
# `cast_slice` deja el tipo a la vista, que es justo lo que se quiere en un sitio
# donde un desajuste de tamaño se manifiesta como basura en pantalla y no como un
# error de compilación.
#
# En el workspace ya está (`graphene-std` lo usa), así que no añade tiempo de
# compilación.
# ------------------------------------------------------------------
bytemuck = { version = "1", features = ["derive"] }

# ------------------------------------------------------------------
# `tracing-log`.
#
# MEDIDO, y es lo mas importante de este commit: NO HABIA NINGUN subscriber de
# `tracing` instalado. Upstream usa `tracing::error!` y `tracing::warn!` por todo
# el motor, y sin subscriber cada evento se descarta en silencio. Es decir: los
# diagnosticos del motor no existian para nosotros. Si el motor fallaba al
# rasterizar y lo decia, no habia forma de verlo.
#
# `tracing-log` (`LogTracer`) traduce los eventos de `tracing` a registros de
# `log`, que es lo que `android_logger` ya sabe escribir, asi que todo sale con
# el mismo tag y el mismo filtro. Una sola via, no dos.
#
# NO hace falta `tracing-subscriber`: montarlo ademas duplicaba cada evento, uno
# por stderr y otro por logcat. Se quita.
# ------------------------------------------------------------------
tracing = "0.1"
tracing-log = "0.2"

# Nota: aquí NO hay `[profile.release]`. Los perfiles solo tienen efecto en la raíz
# del workspace, y el de la raíz (`lto = "thin"`, `debug = true`) es el que se
# aplica. Poner un perfil aquí solo produciría un aviso de cargo. OJO: ese
# `debug = true` es el motivo de que el .so sin strippear pese más de 1 GB; por
# eso el paso de strip en CI no es opcional.
#
# Nota: la edición es 2021 y no la 2024 del workspace. El código de este crate se
# escribió y compiló con 2021 y no gana nada con cambiarlo; mezclar ediciones
# dentro de un workspace es legal.