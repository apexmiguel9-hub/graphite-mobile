name: Graphite Mobile APK

# ------------------------------------------------------------------
# CONSTRUYE EL APK — la capa Kotlin y el `.so` del motor ya compilado.
#
# MEDIDO (repo anterior): el workflow unido tardaba 10:51 minutos, de los cuales
# ~10 eran recompilar un `.so` que no había cambiado ni una línea. Un APK de
# Kotlin mínimo tarda ~1 minuto.
#
# Este workflow baja el `.so` del último `build-so` exitoso y solo compila Kotlin.
# ES EL QUE SE USA CADA VEZ QUE SE TOCA LA UI.
#
# Los dos inputs existen para poder iterar sobre la UI sin pagar los 10 minutos
# del motor: `so_run_id` + `pin_so` permiten repetir el mismo `.so`.
# ------------------------------------------------------------------

on:
  push:
    branches: [master]
    paths:
      # `android/**` entero, y no una lista fichero a fichero. Una lista de
      # `paths` siempre se queda corta: lo que no esté en ella no dispara el
      # workflow, y eso no falla —el workflow simplemente no corre y el "verde"
      # que se ve es el de un commit anterior.
      #
      # MEDIDO: `assets/bridge.js` no lo cubría el filtro, porque se añadió
      # el fichero antes que la regla. Arreglar el shim daba un commit que no
      # compilaba el APK, y tocaba los commits siguientes en un orden que ya no
      # correspondía con el código.
      - 'android/**'
      # `build-frontend.yml` entra porque el shim viaja INCRUSTADO dentro de
      # `WebUI.kt`, y lo incrusta `build-frontend` sustituyendo un marcador.
      #
      # MEDIDO: sin esto, cambiar `build-frontend.yml` o `embed-shim.py` no
      # disparaba el APK, y `build-apk` se bajaba un `WebUI.kt` con el marcador
      # intacto. El sintoma en el movil es
      #
      #   Uncaught ReferenceError: SHIM_PLACEHOLDER is not defined
      #
      # Es decir, el `.kt` que compila es correcto, el `.apk` es valido y el
      # unico fallo es que el shim no se instala. Verde en CI, negro en el movil.
      - '.github/workflows/build-frontend.yml'
      - '.github/workflows/build-apk.yml'
  # Cuando el motor o el frontend se recompilan, el APK se reconstruye con los
  # artefactos nuevos.
  #
  # MEDIDO: faltaba el frontend aqui. `build-apk` se disparaba cuando terminaba
  # `build-so`, pero no cuando terminaba `build-frontend`. Un commit que solo
  # tocaba el frontend no producia ningun APK: habia que Lanzarlo a mano.
  workflow_run:
    workflows: ["Graphite Android SO", "Graphite Mobile frontend"]
    types: [completed]
  workflow_dispatch:
    inputs:
      so_run_id:
        description: 'Run de build-so del que tirar el .so (vacio = el ultimo exitoso)'
        required: false
        default: ''
      pin_so:
        description: 'Usar ese .so viejo a proposito (para iterar en la UI sin tocar el motor)'
        type: boolean
        required: false
        default: false

env:
  ANDROID_API_LEVEL: 36
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build-apk:
    name: APK Kotlin + .so del motor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-apk-

      # ------------------------------------------------------------------
      # OJO con la clave de caché: tiene que ser LA MISMA que en `build-so.yml`.
      # MEDIDO: la primera versión de este workflow usó una clave nueva
      # (`android-sdk-gradle-`) y se comió un fallo real:
      #   > SDK location not found. Define a valid SDK location with an
      #     ANDROID_HOME environment variable
      # porque la caché nunca se había llenado y no había paso de instalación de
      # reserva. Un workflow más rápido que no arranca es peor que uno lento.
      # ------------------------------------------------------------------
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-sdk
          key: android-sdk-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-${{ env.ANDROID_NDK_VERSION }}
          restore-keys: |
            android-sdk-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-

      # El nombre va entre comillas y sin ':' — sin comillas, YAML lo lee como un
      # mapa y el workflow entero deja de ser valido.
      - name: "Install Android SDK (solo si falla la cache, pinned, SHA-256 verificado)"
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-$ANDROID_API_LEVEL" ] \
            && [ -d "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION" ]; then
            echo "SDK ya presente (cache hit)"
          else
            rm -rf "$ANDROID_HOME"
            bash android/scripts/install-pinned-android-sdk.sh "$ANDROID_HOME"
          fi

      # ------------------------------------------------------------------
      # BAJAR EL `.so`. Esto es lo que sustituye a los 10 minutos.
      #
      # `GH_TOKEN` NO ES OPCIONAL: sin él, `gh api` falla por autenticación, el
      # `|| true` se lo come, `RUN_ID` queda vacío y este paso miente diciendo que
      # no hay ningún `build-so` exitoso — aunque acabe de terminar uno bien. Aquí
      # el error se MUESTRA en vez de esconderse.
      # ------------------------------------------------------------------
      - name: Resolve .so run
        id: so
        env:
          GH_TOKEN: ${{ github.token }}
          # `SHA` lo usa el `jq` de abajo para buscar el run de ESTE commit.
          # MEDIDO: sin esto, `set -u` aborta con
          #   SHA: unbound variable
          # y el paso muere antes de decir nada útil.
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          # MEDIDO: mismo defecto que el frontend. Se cogia el ultimo run
          # exitoso, que era de un commit ANTERIOR porque el de este commit aun no
          # habia terminado. El `.so` era viejo y no se notaba, porque el `.so`
          # si cambia poco entre commits y el fallo se manifestaba mucho mas
          # tarde, en el movil.
          #
          # Se prefiere SIEMPRE el run de ESTE commit; si no hay, se avisa.
          if [ "${{ inputs.pin_so }}" = "true" ] && [ -n "${{ inputs.so_run_id }}" ]; then
            RUN_ID="${{ inputs.so_run_id }}"
            echo "Fijado a mano: $RUN_ID"
          else
            RUN_ID=""
            PAGE=1
            while [ -z "$RUN_ID" ]; do
              JSON=$(gh api "repos/$REPO/actions/workflows/build-so.yml/runs?per_page=100&page=$PAGE")
              RUN_ID=$(echo "$JSON" | jq -r --arg sha "$SHA" \
                '.workflow_runs[]
                 | select(.conclusion=="success" and .head_branch=="master" and .head_sha==$sha)
                 | .id' | head -1)
              [ -n "$RUN_ID" ] && break
              RUN_ID=$(echo "$JSON" | jq -r \
                '.workflow_runs[]
                 | select(.conclusion=="success" and .head_branch=="master")
                 | .id' | head -1)
              [ -n "$RUN_ID" ] && break
              PAGE=$((PAGE + 1))
              [ "$PAGE" -gt 10 ] && break
            done
            RUN_SHA=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.head_sha' 2>/dev/null || echo "?")
            if [ "$RUN_SHA" != "$SHA" ]; then
              echo "::warning::el .so es de OTRO commit (este $SHA, el del .so $RUN_SHA)"
              echo "::warning::pasara cuando build-so aun no haya terminado para este commit"
            fi
          fi

          if [ -z "$RUN_ID" ]; then
            echo "::error::no hay ningun build-so exitoso en master."
            echo "::error::Ultimos runs de build-so, con su conclusion:"
            gh api "repos/$REPO/actions/workflows/build-so.yml/runs?per_page=10" \
              --jq '.workflow_runs[] | "  \(.id)  \(.conclusion)  \(.head_branch)  \(.created_at)"' || true
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Usando el .so del run $RUN_ID"

      # ------------------------------------------------------------------
      # BAJAR LA UI. Igual que el `.so`, el frontend viene de otro workflow:
      # así tocar Kotlin no paga la compilación de Rust ni la de npm.
      #
      # MEDIDO, DOS VECES, y las dos por lo mismo:
      #
      #   "el artefacto no trae WebUI.kt con el shim"
      #
      # Se cogía el ÚLTIMO run exitoso de `build-frontend`, y ese run era de un
      # commit ANTERIOR: el de este commit todavía no había terminado. Como el
      # artefacto no tenía el fichero nuevo, el APK fallaba con un error que
      # hablaba de un fichero que el repo ya tenía.
      #
      # El mensaje señalaba `WebUI.kt` y el problema no era `WebUI.kt`.
      #
      # El `.so` tiene el mismo defecto y también lo ha tenido. La solución es
      # la misma en los dos: si hay un run EXITOSO del MISMO commit, ese; si no,
      # uno anterior, diciéndolo en voz alta.
      # ------------------------------------------------------------------
      # ------------------------------------------------------------------
      # BAJAR LA UI. Igual que el `.so`, el frontend viene de otro workflow:
      # así tocar Kotlin no paga la compilación de Rust ni la de npm.
      #
      # Y AQUI ESTA ESPERAR, QUE ES LO QUE FALTABA.
      #
      # MEDIDO: `build-apk` se dispara al terminar `build-so`, y `build-so`
      # termina ANTES que `build-frontend` —el motor tarda 10 min, el frontend 12.
      # O sea que el APK SIEMPRE se construia con el frontend del commit
      # ANTERIOR. Con el aviso puesto se veia claro:
      #
      #   ::warning::el frontend es de OTRO commit
      #   ::warning::  este:    da38426
      #   ::warning::  el de UI: 029caa5
      #
      # y el fallo era un `WebUI.kt` viejo, con errores de compilacion de hace
      # tres commits. Verde el frontend, verde el motor, y el APK fallando por
      # codigo que ya no existe en el repo.
      #
      # Ahora se espera al run de ESTE commit, hasta 25 minutos. Si no llega, se
      # usa el anterior y se avisa, que es mejor que no tener APK.
      # ------------------------------------------------------------------
      # ------------------------------------------------------------------
      # BAJAR LA UI. Igual que el `.so`, el frontend viene de otro workflow:
      # así tocar Kotlin no paga la compilación de Rust ni la de npm.
      #
      # Y AQUÍ ESTA ESPERAR, QUE ES LO QUE FALTABA.
      #
      # MEDIDO, dos veces:
      #
      #  1. `build-apk` se dispara al terminar `build-so`, y `build-so` termina
      #     ANTES que `build-frontend` —el motor tarda 10 min, el frontend 12.
      #     O sea que el APK se construía SIEMPRE con el frontend del commit
      #     ANTERIOR, y el fallo era un `WebUI.kt` de hace tres commits:
      #
      #       ::warning::el frontend es de OTRO commit
      #       ::warning::  este:    da38426
      #       ::warning::  el de UI: 029caa5
      #
      #  2. Al esperar a ciegas seTllegaron los 25 min sin(run) porque este
      #     commit solo tocaba `.github/workflows/build-apk.yml`, que NO está en
      #     los `paths` de `build-frontend`. Ese workflow nunca se launcher
      #     nunca, y el APK estuvo 25 minutos esperando a algo que no iba a pasar.
      #
      # LA REGLA CORRECTA: esperar solo si YA HAY un run en marcha para este
      # commit. Si no hay ninguno, es que el commit no toca el frontend, y
      # entonces el último frontend exitoso es exactamente el que toca.
      # ------------------------------------------------------------------
      - name: Resolve frontend run
        id: fe
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          runs_de_este_commit() {
            # 'pending' | 'in_progress' = hay uno en marcha.
            # 'completed' = ya se sabe el resultado.
            # ausente = este commit no toca el frontend.
            local estados
            estados=$(gh api "repos/$REPO/actions/workflows/build-frontend.yml/runs?per_page=100&branch=master" \
              | jq -r --arg sha "$SHA" \
                  '.workflow_runs[] | select(.head_sha==$sha)
                   | "\(.status) \(.conclusion // "-") \(.id)"')
            echo "$estados"
          }

          ESPERA=0
          LIMITE=$((25 * 60))
          while :; do
            ESTADOS=$(runs_de_este_commit)
            echo "$ESTADOS" | grep -q '^completed success ' \
              && { RUN_ID=$(echo "$ESTADOS" | awk '/^completed success /{print $3; exit}'); break; }
            EN_MARCHA=$(echo "$ESTADOS" | grep -cE '^(pending|in_progress) ' || true)
            [ "$EN_MARCHA" -gt 0 ] || break
            if [ "$ESPERA" -eq 0 ]; then
              echo "Hay $EN_MARCHA run(s) de frontend para este commit; se espera."
              echo "(build-so termina antes que build-frontend, asi que sin esto"
              echo " el APK seria de un commit anterior)"
            fi
            [ "$ESPERA" -lt "$LIMITE" ] || break
            sleep 30
            ESPERA=$((ESPERA + 30))
          done

          if [ -n "${RUN_ID:-}" ]; then
            echo "  frontend del MISMO commit: $RUN_ID (esperados ${ESPERA}s)"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No hay run de este commit: este commit no toca el frontend, asi que
          # el último exitoso es el correcto.
          echo "  este commit no toca el frontend: se usa el último compulado"
          RUN_ID=$(gh api "repos/$REPO/actions/workflows/build-frontend.yml/runs?per_page=100&branch=master" \
            | jq -r '.workflow_runs[]
               | select(.conclusion=="success" and .head_branch=="master") | .id' | head -1)
          if [ -z "$RUN_ID" ]; then
            echo "::error::no hay ningun build-frontend exitoso en master."
            echo "::error::La UI es obligatoria: sin ella el APK abre una pantalla gris."
            exit 1
          fi
          RUN_SHA=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.head_sha')
          echo "  frontend usado: $RUN_ID ($RUN_SHA)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download the frontend into assets
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.fe.outputs.run_id }}
        run: |
          set -euo pipefail
          DEST=android/app/src/main/assets
          rm -rf "$DEST"
          mkdir -p "$DEST"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n graphite-mobile-frontend \
            -D /tmp/fe

          # MEDIDO: `gh run download` descarga el CONTENIDO del artefacto, no un
          # zip que lo contenga. El `.tar.gz` que sube el workflow llega ya
          # descomprimido, con su nombre dentro. Intentar `/tmp/fe/<nombre>.tar.gz`
          # falla con "Cannot open: No such file or directory".
          #
          # Se busca por patron en vez de por nombre exacto, para no volver a
          # atar este paso al nombre que le ponga el otro workflow.
          TARBALL=$(find /tmp/fe -name '*.tar.gz' | head -1)
          if [ -z "$TARBALL" ]; then
            echo "::error::no hay ningun .tar.gz en /tmp/fe. Contenido:"
            ls -la /tmp/fe
            exit 1
          fi
          echo "  tarball: $TARBALL ($(stat -c%s "$TARBALL") bytes)"
          tar -xzf "$TARBALL" -C "$DEST"
          echo "=== assets/ ==="
          ls -la "$DEST"
          # El shim y el index.html TIENEN que estar: sin el shim el wasm no
          # encuentra `sendNativeMessage` y la UI no arranca. Verde igual.
          for f in index.html bridge.js bundle.js style.css glue.wasm; do
            test -f "$DEST/$f" \
              || { echo "::error::falta $f en los assets de la UI"; exit 1; }
            echo "  OK  $f"
          done

          # ------------------------------------------------------------------
          # EL SHIM ESTA DENTRO DEL KOTLIN.
          #
          # MEDIDO: el `.apk` puede compilar, ser valido y aun asi no llevar el
          # shim. Pasa cuando este workflow corre con un `WebUI.kt` viejo, con el
          # marcador `SHIM_PLACEHOLDER` sin sustituir: el Kotlin compila (es una
          # cadena normal), el APK se genera, y en el movil lo que se evalua es
          #
          #     Uncaught ReferenceError: SHIM_PLACEHOLDER is not defined
          #
          # La UI no aparece y no hay ningun error de compilacion. Se comprueba
          # el artefacto FINAL, que es lo que va a instalar el movil.
          # ------------------------------------------------------------------
          SZ=$(stat -c%s "$DEST/bundle.js")
          echo "  bundle.js: $SZ bytes"
          test "$SZ" -gt 100000 \
            || { echo "::error::bundle.js de $SZ bytes: no es la app"; exit 1; }
          # ------------------------------------------------------------------
          # EL WASM: NOMBRE Y PREFIJO.
          #
          # El bundle lo pide por `/assets/<nombre>.wasm`. Ese prefijo NO se
          # sustituye nunca: es el que registra `WebViewAssetLoader`, que lo
          # traduce a la RAIZ de `assets/`, que es lo unico que
          # `AssetsPathHandler` puede hacer: solo tiene el constructor de un
          # argumento. Leidos los constructores del `webkit-1.12.1.aar`:
          #
          #   AssetsPathHandler(Context)
          #   AssetsPathHandler(AssetHelper)   <- interno de androidx
          #
          # Por eso la UI vive en `assets/` y no en `assets/web/`. Y como el
          # bundle pide por rutas ABSOLUTAS, todo tiene que estar en esa misma
          # raiz: `/assets/glue.wasm`, `/assets/thumbnail-*.png`.
          #
          # MEDIDO, dos veces, por el mismo motivo:
          #  - con el wasm un nivel mas abajo, el handler no lo encontraba:
          #      Failed to execute 'compile' on 'WebAssembly': HTTP status code
          #      is not ok
          #  - con el prefijo `/assets/` sustituido, la ruta quedaba RELATIVA y
          #    resolvia contra la pagina, no contra el handler:
          #      ::error::el bundle ya no cita /assets/glue.wasm
          #
          # Lo que se cambia es el NOMBRE con hash; el prefijo se queda.
          # ------------------------------------------------------------------
          grep -q '/assets/glue\.wasm' "$DEST/bundle.js" \
            || { echo "::error::el bundle no cita /assets/glue.wasm"; exit 1; }
          grep -q 'graphite_wasm_wrapper_bg-' "$DEST/bundle.js" \
            && { echo "::error::quedo el nombre con hash del wasm en el bundle"; exit 1; }
          test -f "$DEST/glue.wasm" \
            || { echo "::error::no existe glue.wasm en la raiz de los assets"; exit 1; }
          echo "  OK  /assets/glue.wasm apunta a $DEST/glue.wasm, sin hash"

          # LAS MINIATURAS, que tambien van por ruta absoluta y se perdian en
          # silencio: CERO ficheros `thumbnail-*` en el APK, y el menu de
          # bienvenida salia sin imagenes y sin un solo error.
          N=$(find "$DEST" -maxdepth 1 -name 'thumbnail-*.png' | wc -l)
          test "$N" -gt 0 \
            || { echo "::error::no hay miniaturas; el welcome saldra vacio"; exit 1; }
          echo "  OK  $N miniaturas en la raiz de los assets"

          # ------------------------------------------------------------------
          # `type="module"`, Y QUE EL BUNDLE NECESITE MODULE.
          #
          # MEDIDO: sin `type="module"`, el WebView lanza
          #   Uncaught SyntaxError: Cannot use 'import.meta' outside a module
          # y el frontend no arranca. Verde en CI, negro en el móvil.
          #
          # Vite emite un ES module porque usa `import.meta.url` para localizar su
          # propio `.wasm`. Si el bundle lo usa, el `<script>` TIENE que ser
          # module; y si no lo usa, `type="module"` no hace daño.
          #
          # Se comprueban las dos mitades: que el index lo declare, y que el
          # bundle lo necesite. Un cambio en cualquiera de las dos da error en el
          # build en vez de en el móvil.
          # ------------------------------------------------------------------
          grep -q 'type="module"' "$DEST/index.html" \
            || { echo "::error::index.html no declara type=\"module\" en el script"; exit 1; }
          grep -q 'import\.meta' "$DEST/bundle.js" \
            || { echo "::error::el bundle NO usa import.meta; el index.html declara"
               echo "::error::type=\"module\" sin necesidad. Revisar el contrato"; exit 1; }
          echo "  OK  index.html declara type=\"module\" y el bundle lo necesita"

          # EL CSS. MEDIDO: vite saca el CSS del bundle y lo mete en un `<link>`
          # del `index.html` que genera. Este `index.html` es NUESTRO y lo
          # reemplaza, asi que el `<link>` se perdia y la UI salia SIN ESTILOS:
          # arrancaba, dibujaba, enviaba mensajes al motor, y todo mal puesto.
          # Sin un solo error en ningun log.
          #
          # El bundle no lo menciona: no hay forma de que lo pida por su cuenta.
          grep -q 'style\.css' "$DEST/index.html" \
            || { echo "::error::index.html no enlaza style.css: la UI saldra sin estilos"; exit 1; }
          test -f "$DEST/style.css" \
            || { echo "::error::index.html enlaza style.css pero el fichero no esta"; exit 1; }
          echo "  OK  index.html enlaza style.css y el fichero existe"


      - name: Download .so
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.so.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n graphite-mobile-so \
            -D android/app/src/main/jniLibs/arm64-v8a
          SO=android/app/src/main/jniLibs/arm64-v8a/libgraphite_android.so
          test -f "$SO" || { echo "::error::no se ha descargado el .so"; exit 1; }
          SZ=$(stat -c%s "$SO")
          echo "  .so: $SZ bytes"
          # MEDIDO: el .so SIN motor mide 4,95 MB; con motor, 58 MB. Si bajamos
          # de 30 MB es que se descargó el equivocado.
          if [ "$SZ" -lt 30000000 ]; then
            echo "::error::el .so pesa $SZ bytes: parece el .so SIN motor. No compiles el APK."
            exit 1
          fi
          for sym in graphite_editor graphene_core graph_craft; do
            strings "$SO" | grep -q "$sym" || { echo "::error::falta el simbolo $sym"; exit 1; }
          done
          echo "  motor verificado dentro"

      # ------------------------------------------------------------------
      # COMPILAR KOTLIN, SIN ENSAMBLAR.
      #
      # MEDIDO: `assembleDebug` tardaba 30-40 s y la mitad de ese tiempo es
      # empaquetar y firmar un APK de 62 MB que no se va a mirar cuando lo que
      # falla es un error de sintaxis de Kotlin. Separado, el error de Kotlin
      # aparece en 25 s y el log es el del compilador y nada más.
      #
      # `compileDebugKotlin` es exactamente el mismo compilador, con los mismos
      # fuentes: no puede pasar algo que compile aquí y falle después.
      # ------------------------------------------------------------------
      # ------------------------------------------------------------------
      # EL SHIM SE INCRUSTA AQUI, NO EN EL ARTEFACTO DEL FRONTEND.
      #
      # MEDIDO, y este es el fallo de diseño más caro de la fase: el `WebUI.kt`
      # con el shim viajaba en el artefacto de `build-frontend`, y este workflow
      # lo copiaba encima del `.kt` del repo. Cuando el commit no tocaba el
      # frontend —la mitad de los commits— se usaba un artefacto de un commit
      # ANTERIOR, y eso REVERTÍA el Kotlin nuevo con el viejo:
      #
      #   Unresolved reference 'assetLoader'
      #   Unresolved reference 'baseUrl'
      #   Unresolved reference 'inyectarShim'
      #
      # Errores de hace cuatro commits, en un repo donde ya estaban arreglados.
      # El aviso "el frontend es de OTRO commit" salía y era cierto; lo que no
      # se veía era que el efecto era REVERTIR código, no usar uno viejo.
      #
      # El shim no tiene nada que ver con el frontend: `bridge.js` está en el
      # repo y el incrustado es cosa del APK. Va en su propio paso, antes de
      # compilar, y sobre el `WebUI.kt` de ESTE commit.
      # ------------------------------------------------------------------
      - name: Embed the shim into WebUI.kt
        run: |
          set -euo pipefail
          KT=android/app/src/main/kotlin/dev/graphite/mobile/WebUI.kt
          test -f "$KT" || { echo "::error::no existe $KT"; exit 1; }
          python3 android/scripts/embed-shim.py "$KT"

          DELIM=$(python3 -c "print(chr(34) * 3 + 'SHIM_PLACEHOLDER' + chr(34) * 3)")
          if grep -qF "$DELIM" "$KT"; then
            echo "::error::el marcador sin sustituir sigue en $KT"
            exit 1
          fi
          for g in 'window.sendNativeMessage' 'window.initializeNativeCommunication'; do
            grep -q "$g" "$KT" \
              || { echo "::error::el shim incrustado no define $g"; exit 1; }
          done
          echo "  OK  el shim incrustado en WebUI.kt (3 globals presentes)"

      - name: Compile Kotlin (fail fast)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon compileDebugKotlin 2>&1 | tee /tmp/kotlin.log || {
            echo "::group::errores de Kotlin"
            # Los errores de Kotlin vienen en lineas `e: fichero.kt:12:3 ...`.
            # Sin el `2>&1` no salen: Gradle las escribe por stderr y el pipe se
            # las come.
            grep -E "^e: |\.kt:[0-9]+:[0-9]+" /tmp/kotlin.log || true
            echo "::endgroup::"
            exit 1
          }

      - name: Assemble the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # El `.so` tiene que estar DENTRO del APK. Un `assembleDebug` que se pasa
      # sin el `.so` compila igual de bien y deja una app que muere al arrancar.
      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "  APK: $APK ($(stat -c%s "$APK") bytes)"
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck && unzip -qo "$APK" -d /tmp/apkcheck
          SO=/tmp/apkcheck/lib/arm64-v8a/libgraphite_android.so
          test -f "$SO" || { echo "::error::el APK NO lleva el .so dentro"; exit 1; }
          echo "  .so en el APK: $(stat -c%s "$SO") bytes"

          # Los cinco símbolos JNI, con el nombre EXACTO que espera Kotlin.
          #
          # MEDIDO: son cinco, no tres. Añadir una función `native` en Kotlin y
          # olvidarse de exportarla desde Rust no da ningún error de
          # compilación: el `external fun` compila siempre. El fallo es un
          # `UnsatisfiedLinkError` en el móvil, al arrancar, y solo nombra el
          # símbolo que falta.
          #
          # Por eso se comprueban los cinco contra la lista de `external fun` del
          # código Kotlin, y no contra una lista escrita aquí que se quedaría
          # corta en la próxima función nueva.
          # ------------------------------------------------------------------
          # LOS SIMBOLOS JNI, Y EL FICHERO DEL QUE SALEN.
          #
          # El simbolo se compone de PAQUETE + FICHERO + FUNCION:
          #
          #   Java_dev_graphite_mobile_<FICHERO>Kt_<funcion>
          #
          # MEDIDO: `nativeMessage` estaba declarada en `WebUI.kt`, asi que Kotlin
          # buscaba `WebUIKt` y Rust exportaba `MainActivityKt`. En el movil:
          #
          #   java.lang.UnsatisfiedLinkError: No implementation found for
          #     dev.graphite.mobile.WebUIKt.nativeMessage(java.lang.String)
          #
          # Y el CI daba VERDE, porque este check miraba el NOMBRE de las
          # funciones y daba por hecho el `MainActivityKt` de ahi. Las tres
          # primeras estaban en `MainActivity.kt` y coincidian; las dos nuevas
          # no, y nadie lo vio hasta que el movil las llamo.
          #
          # El script deriva el nombre del FICHERO de verdad, asi que anadir una
          # funcion en el fichero que toque ya no puede colarse.
          # ------------------------------------------------------------------
          python3 android/scripts/check-jni-symbols.py \
            "$SO" android/app/src/main/kotlin

          # La Activity también, y con la herramienta CORRECTA.
          #
          # OJO: `unzip -l | grep MainActivity` NO funciona, y no porque falte la
          # Activity. Un APK no tiene ningún fichero llamado `MainActivity`: lleva
          # `classes.dex`, `AndroidManifest.xml` y `lib/...`. La Activity vive
          # dentro del DEX y del manifiesto. (Medido: este assert falló con el
          # motor y los símbolos JNI dentro,oos por buscar un fichero que no
          # existe.)
          #
          # `aapt2 dump` sí lee el manifiesto. Se comprueba además el paquete,
          # que es lo que impide que dos APKs distintos se pisen.
          #
          # Sin `| grep -q`: con `set -o pipefail`, si grep encuentra y sale
          # antes, el producerse queda con SIGPIPE y el pipeline se marca como
          # fallido. Se guarda en una variable y se busca encima.
          AAPT2="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt2"
          test -x "$AAPT2" || { echo "::error::no existe $AAPT2"; exit 1; }

          BADGING=$("$AAPT2" dump badging "$APK")
          case "$BADGING" in
            *"name='dev.graphite.mobile'"*) echo "  OK  paquete dev.graphite.mobile" ;;
            *) echo "::error::paquete inesperado:"; echo "$BADGING" | head -3; exit 1 ;;
          esac

          MANIFEST=$("$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml)
          case "$MANIFEST" in
            *MainActivity*) echo "  OK  MainActivity en el manifiesto" ;;
            *) echo "::error::el manifiesto NO declara MainActivity"; exit 1 ;;
          esac
          case "$BADGING" in
            *"launchable-activity: name='dev.graphite.mobile.MainActivity'"*)
              echo "  OK  launchable-activity" ;;
            *) echo "::error::no hay launchable-activity (la app no abriria):"
               echo "$BADGING" | grep -i 'launchable' || echo "  (no hay ninguna)"
               exit 1 ;;
          esac

          echo "VEREDICTO: el APK lleva el motor y abre MainActivity"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: graphite-mobile-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30