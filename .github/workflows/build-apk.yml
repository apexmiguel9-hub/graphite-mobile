name: Graphite Mobile APK

# ------------------------------------------------------------------
# CONSTRUYE EL APK — la capa Kotlin y el `.so` del motor ya compilado.
#
# MEDIDO (repo anterior): el workflow unido tardaba 10:51 minutos, de los cuales
# ~10 eran recompilar un `.so` que no había cambiado ni una línea. Un APK de
# Kotlin mínimo tarda ~1 minuto.
#
# Este workflow baja el `.so` del último `build-so` exitoso y solo compila Kotlin.
# ES EL QUE SE USA CADA VEZ QUE SE TOCA LA UI.
#
# Los dos inputs existen para poder iterar sobre la UI sin pagar los 10 minutos
# del motor: `so_run_id` + `pin_so` permiten repetir el mismo `.so`.
# ------------------------------------------------------------------

on:
  push:
    branches: [master]
    paths:
      # `android/**` entero, y no una lista fichero a fichero. Una lista de
      # `paths` siempre se queda corta: lo que no esté en ella no dispara el
      # workflow, y eso no falla —el workflow simplemente no corre y el "verde"
      # que se ve es el de un commit anterior.
      #
      # MEDIDO: `assets/web/bridge.js` no lo cubría el filtro, porque se añadió
      # el fichero antes que la regla. Arreglar el shim daba un commit que no
      # compilaba el APK, y tocaba los commits siguientes en un orden que ya no
      # correspondía con el código.
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  # Cuando el motor se recompila, el APK se reconstruye con el `.so` nuevo.
  workflow_run:
    workflows: ["Graphite Android SO"]
    types: [completed]
  workflow_dispatch:
    inputs:
      so_run_id:
        description: 'Run de build-so del que tirar el .so (vacio = el ultimo exitoso)'
        required: false
        default: ''
      pin_so:
        description: 'Usar ese .so viejo a proposito (para iterar en la UI sin tocar el motor)'
        type: boolean
        required: false
        default: false

env:
  ANDROID_API_LEVEL: 36
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build-apk:
    name: APK Kotlin + .so del motor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-apk-

      # ------------------------------------------------------------------
      # OJO con la clave de caché: tiene que ser LA MISMA que en `build-so.yml`.
      # MEDIDO: la primera versión de este workflow usó una clave nueva
      # (`android-sdk-gradle-`) y se comió un fallo real:
      #   > SDK location not found. Define a valid SDK location with an
      #     ANDROID_HOME environment variable
      # porque la caché nunca se había llenado y no había paso de instalación de
      # reserva. Un workflow más rápido que no arranca es peor que uno lento.
      # ------------------------------------------------------------------
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-sdk
          key: android-sdk-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-${{ env.ANDROID_NDK_VERSION }}
          restore-keys: |
            android-sdk-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-

      # El nombre va entre comillas y sin ':' — sin comillas, YAML lo lee como un
      # mapa y el workflow entero deja de ser valido.
      - name: "Install Android SDK (solo si falla la cache, pinned, SHA-256 verificado)"
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-$ANDROID_API_LEVEL" ] \
            && [ -d "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION" ]; then
            echo "SDK ya presente (cache hit)"
          else
            rm -rf "$ANDROID_HOME"
            bash android/scripts/install-pinned-android-sdk.sh "$ANDROID_HOME"
          fi

      # ------------------------------------------------------------------
      # BAJAR EL `.so`. Esto es lo que sustituye a los 10 minutos.
      #
      # `GH_TOKEN` NO ES OPCIONAL: sin él, `gh api` falla por autenticación, el
      # `|| true` se lo come, `RUN_ID` queda vacío y este paso miente diciendo que
      # no hay ningún `build-so` exitoso — aunque acabe de terminar uno bien. Aquí
      # el error se MUESTRA en vez de esconderse.
      # ------------------------------------------------------------------
      - name: Resolve .so run
        id: so
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          if [ "${{ inputs.pin_so }}" = "true" ] && [ -n "${{ inputs.so_run_id }}" ]; then
            RUN_ID="${{ inputs.so_run_id }}"
            echo "Fijado a mano: $RUN_ID"
          else
            RUN_ID=""
            PAGE=1
            while [ -z "$RUN_ID" ]; do
              JSON=$(gh api "repos/$REPO/actions/workflows/build-so.yml/runs?per_page=100&page=$PAGE")
              IDS=$(echo "$JSON" \
                | jq -r '.workflow_runs[] | select(.conclusion=="success" and .head_branch=="master") | .id')
              RUN_ID=$(echo "$IDS" | head -1)
              [ -z "$RUN_ID" ] && PAGE=$((PAGE + 1))
              if [ "$PAGE" -gt 10 ]; then break; fi
            done
          fi

          if [ -z "$RUN_ID" ]; then
            echo "::error::no hay ningun build-so exitoso en master."
            echo "::error::Ultimos runs de build-so, con su conclusion:"
            gh api "repos/$REPO/actions/workflows/build-so.yml/runs?per_page=10" \
              --jq '.workflow_runs[] | "  \(.id)  \(.conclusion)  \(.head_branch)  \(.created_at)"' || true
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Usando el .so del run $RUN_ID"

      # ------------------------------------------------------------------
      # BAJAR LA UI. Igual que el `.so`, el frontend viene de otro workflow:
      # así tocar Kotlin no paga la compilación de Rust ni la de npm.
      # ------------------------------------------------------------------
      - name: Resolve frontend run
        id: fe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          RUN_ID=""
          PAGE=1
          while [ -z "$RUN_ID" ]; do
            JSON=$(gh api "repos/$REPO/actions/workflows/build-frontend.yml/runs?per_page=100&page=$PAGE")
            IDS=$(echo "$JSON" \
              | jq -r '.workflow_runs[] | select(.conclusion=="success" and .head_branch=="master") | .id')
            RUN_ID=$(echo "$IDS" | head -1)
            [ -z "$RUN_ID" ] && PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 10 ]; then break; fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::no hay ningun build-frontend exitoso en master."
            echo "::error::La UI es obligatoria: sin ella el APK abre una pantalla gris."
            gh api "repos/$REPO/actions/workflows/build-frontend.yml/runs?per_page=10" \
              --jq '.workflow_runs[] | "  \(.id)  \(.conclusion)  \(.head_branch)  \(.created_at)"' || true
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Usando el frontend del run $RUN_ID"

      - name: Download the frontend into assets/web
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.fe.outputs.run_id }}
        run: |
          set -euo pipefail
          DEST=android/app/src/main/assets/web
          rm -rf "$DEST"
          mkdir -p "$DEST"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n graphite-mobile-frontend \
            -D /tmp/fe

          # MEDIDO: `gh run download` descarga el CONTENIDO del artefacto, no un
          # zip que lo contenga. El `.tar.gz` que sube el workflow llega ya
          # descomprimido, con su nombre dentro. Intentar `/tmp/fe/<nombre>.tar.gz`
          # falla con "Cannot open: No such file or directory".
          #
          # Se busca por patron en vez de por nombre exacto, para no volver a
          # atar este paso al nombre que le ponga el otro workflow.
          TARBALL=$(find /tmp/fe -name '*.tar.gz' | head -1)
          if [ -z "$TARBALL" ]; then
            echo "::error::no hay ningun .tar.gz en /tmp/fe. Contenido:"
            ls -la /tmp/fe
            exit 1
          fi
          echo "  tarball: $TARBALL ($(stat -c%s "$TARBALL") bytes)"
          tar -xzf "$TARBALL" -C "$DEST"
          echo "=== assets/web ==="
          ls -la "$DEST"
          # El shim y el index.html TIENEN que estar: sin el shim el wasm no
          # encuentra `sendNativeMessage` y la UI no arranca. Verde igual.
          for f in index.html bridge.js bundle.js assets/glue.wasm; do
            test -f "$DEST/$f" \
              || { echo "::error::falta $f en los assets de la UI"; exit 1; }
            echo "  OK  $f"
          done
          SZ=$(stat -c%s "$DEST/bundle.js")
          echo "  bundle.js: $SZ bytes"
          test "$SZ" -gt 100000 \
            || { echo "::error::bundle.js de $SZ bytes: no es la app"; exit 1; }
          # Y el glue tiene que citar el nombre del wasm, que se ha renombrado.
          # MEDIDO: la referencia al wasm dentro del bundle queda como
          # `/assets/glue.wasm`, con ruta ABSOLUTA. Con `file://` eso significa
          # la raiz del sistema de ficheros, y el wasm no se carga: el frontend
          # se queda esperando el modulo.
          #
          # Por eso el wasm va en `assets/web/assets/glue.wasm`, no en
          # `assets/web/glue.wasm`: para que la ruta absoluta coincida.
          #
          # Es el mismo motivo por el que el frontend se sirve por
          # `file:///android_asset/web/index.html` y no con un `WebViewAssetLoader`
          # que sirviese desde `https://appassets.androidplatform.net`: el
          # frontend construye rutas con `/` delante.
          grep -q 'glue.wasm' "$DEST/bundle.js" \
            || { echo "::error::el bundle no cita glue.wasm: el wasm no cargara"; exit 1; }
          # No se intenta recuperar la ruta con `grep -o`: el bundle esta minificado en
          # una sola linea y `[^"']*` se come medio fichero, devolviendo basura.
          # Se comprueba lo unico que importa: que el fichero este donde la ruta
          # `/assets/glue.wasm` va a buscarlo.
          # ------------------------------------------------------------------
          # `type="module"`, Y QUE EL BUNDLE NECESITE MODULE.
          #
          # MEDIDO: sin `type="module"` en el `<script>`, el WebView lanza
          #   Uncaught SyntaxError: Cannot use 'import.meta' outside a module
          # y el frontend no arranca. Verde en CI, negro en el móvil.
          #
          # Vite emite un ES module porque usa `import.meta.url` para localizar su
          # propio `.wasm`. Si el bundle lo usa, el `<script>` TIENE que ser
          # module; y si no lo usa, `type="module"` no hace daño.
          #
          # Aquí se comprueban las dos mitades: que el index lo declare, y que el
          # bundle lo necesite. Con eso, un cambio en cualquiera de las dos
          # secciones del contrato da error en el build en vez de en el móvil.
          # ------------------------------------------------------------------
          grep -q 'type="module"' "$DEST/index.html" \
            || { echo "::error::index.html no declara type=\"module\" en el script"; exit 1; }
          echo "  OK  index.html declara type=\"module\""

          grep -q 'import\.meta' "$DEST/bundle.js" \
            || { echo "::error::el bundle NO usa import.meta; el index.html declara"
               echo "::error::type=\"module\" sin necesidad. Revisar el contrato"; exit 1; }
          echo "  OK  el bundle usa import.meta, type=\"module\" es necesario"

          test -f "$DEST/assets/glue.wasm" \
            || { echo "::error::no existe assets/glue.wasm: el wasm no cargara"; exit 1; }
          HASHED=$(find "$DEST/assets" -name 'graphite_wasm_wrapper_bg-*.wasm' | head -1)
          if [ -n "$HASHED" ]; then
            echo "::error::quedo un wasm con el nombre con hash: $HASHED"
            echo "::error::el glue buscara ese nombre, y el hash ya no cuadra"
            exit 1
          fi
          echo "  OK  assets/glue.wasm en su sitio, sin hash residual"

      - name: Download .so
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.so.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n graphite-mobile-so \
            -D android/app/src/main/jniLibs/arm64-v8a
          SO=android/app/src/main/jniLibs/arm64-v8a/libgraphite_android.so
          test -f "$SO" || { echo "::error::no se ha descargado el .so"; exit 1; }
          SZ=$(stat -c%s "$SO")
          echo "  .so: $SZ bytes"
          # MEDIDO: el .so SIN motor mide 4,95 MB; con motor, 58 MB. Si bajamos
          # de 30 MB es que se descargó el equivocado.
          if [ "$SZ" -lt 30000000 ]; then
            echo "::error::el .so pesa $SZ bytes: parece el .so SIN motor. No compiles el APK."
            exit 1
          fi
          for sym in graphite_editor graphene_core graph_craft; do
            strings "$SO" | grep -q "$sym" || { echo "::error::falta el simbolo $sym"; exit 1; }
          done
          echo "  motor verificado dentro"

      # ------------------------------------------------------------------
      # COMPILAR KOTLIN, SIN ENSAMBLAR.
      #
      # MEDIDO: `assembleDebug` tardaba 30-40 s y la mitad de ese tiempo es
      # empaquetar y firmar un APK de 62 MB que no se va a mirar cuando lo que
      # falla es un error de sintaxis de Kotlin. Separado, el error de Kotlin
      # aparece en 25 s y el log es el del compilador y nada más.
      #
      # `compileDebugKotlin` es exactamente el mismo compilador, con los mismos
      # fuentes: no puede pasar algo que compile aquí y falle después.
      # ------------------------------------------------------------------
      - name: Compile Kotlin (fail fast)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon compileDebugKotlin 2>&1 | tee /tmp/kotlin.log || {
            echo "::group::errores de Kotlin"
            # Los errores de Kotlin vienen en lineas `e: fichero.kt:12:3 ...`.
            # Sin el `2>&1` no salen: Gradle las escribe por stderr y el pipe se
            # las come.
            grep -E "^e: |\.kt:[0-9]+:[0-9]+" /tmp/kotlin.log || true
            echo "::endgroup::"
            exit 1
          }

      - name: Assemble the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # El `.so` tiene que estar DENTRO del APK. Un `assembleDebug` que se pasa
      # sin el `.so` compila igual de bien y deja una app que muere al arrancar.
      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "  APK: $APK ($(stat -c%s "$APK") bytes)"
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck && unzip -qo "$APK" -d /tmp/apkcheck
          SO=/tmp/apkcheck/lib/arm64-v8a/libgraphite_android.so
          test -f "$SO" || { echo "::error::el APK NO lleva el .so dentro"; exit 1; }
          echo "  .so en el APK: $(stat -c%s "$SO") bytes"

          # Los cinco símbolos JNI, con el nombre EXACTO que espera Kotlin.
          #
          # MEDIDO: son cinco, no tres. Añadir una función `native` en Kotlin y
          # olvidarse de exportarla desde Rust no da ningún error de
          # compilación: el `external fun` compila siempre. El fallo es un
          # `UnsatisfiedLinkError` en el móvil, al arrancar, y solo nombra el
          # símbolo que falta.
          #
          # Por eso se comprueban los cinco contra la lista de `external fun` del
          # código Kotlin, y no contra una lista escrita aquí que se quedaría
          # corta en la próxima función nueva.
          MAPEOS=0
          for sym in $(grep -ho 'external fun native[A-Za-z]*' \
                         android/app/src/main/kotlin/dev/graphite/mobile/*.kt \
                       | sed 's/external fun //'); do
            if grep -qa "Java_dev_graphite_mobile_MainActivityKt_$sym" "$SO"; then
              echo "  OK  $sym"
              MAPEOS=$((MAPEOS + 1))
            else
              echo "::error::el APK lleva un .so SIN el simbolo $sym"
              echo "::error::Kotlin declara 'external fun $sym' pero Rust no lo exporta:"
              echo "::error::  falta #[export_name = \"Java_dev_graphite_mobile_MainActivityKt_$sym\"]"
              MAPEOS=-1
            fi
          done
          test "$MAPEOS" -gt 0 || { echo "::error::faltan simbolos JNI en el .so"; exit 1; }
          echo "  $MAPEOS/5 simbolos JNI presentes"

          # La Activity también, y con la herramienta CORRECTA.
          #
          # OJO: `unzip -l | grep MainActivity` NO funciona, y no porque falte la
          # Activity. Un APK no tiene ningún fichero llamado `MainActivity`: lleva
          # `classes.dex`, `AndroidManifest.xml` y `lib/...`. La Activity vive
          # dentro del DEX y del manifiesto. (Medido: este assert falló con el
          # motor y los símbolos JNI dentro,oos por buscar un fichero que no
          # existe.)
          #
          # `aapt2 dump` sí lee el manifiesto. Se comprueba además el paquete,
          # que es lo que impide que dos APKs distintos se pisen.
          #
          # Sin `| grep -q`: con `set -o pipefail`, si grep encuentra y sale
          # antes, el producerse queda con SIGPIPE y el pipeline se marca como
          # fallido. Se guarda en una variable y se busca encima.
          AAPT2="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt2"
          test -x "$AAPT2" || { echo "::error::no existe $AAPT2"; exit 1; }

          BADGING=$("$AAPT2" dump badging "$APK")
          case "$BADGING" in
            *"name='dev.graphite.mobile'"*) echo "  OK  paquete dev.graphite.mobile" ;;
            *) echo "::error::paquete inesperado:"; echo "$BADGING" | head -3; exit 1 ;;
          esac

          MANIFEST=$("$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml)
          case "$MANIFEST" in
            *MainActivity*) echo "  OK  MainActivity en el manifiesto" ;;
            *) echo "::error::el manifiesto NO declara MainActivity"; exit 1 ;;
          esac
          case "$BADGING" in
            *"launchable-activity: name='dev.graphite.mobile.MainActivity'"*)
              echo "  OK  launchable-activity" ;;
            *) echo "::error::no hay launchable-activity (la app no abriria):"
               echo "$BADGING" | grep -i 'launchable' || echo "  (no hay ninguna)"
               exit 1 ;;
          esac

          echo "VEREDICTO: el APK lleva el motor y abre MainActivity"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: graphite-mobile-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30