name: Graphite Mobile frontend

# ------------------------------------------------------------------
# COMPILA EL FRONTEND (Svelte) EN MODO NATIVO → `frontend/dist`
#
# Esto es lo que va dentro del WebView. No es una copia del sitio web: es el
# mismo frontend compilado con `--mode native`, que es como lo carga el
# escritorio dentro de CEF.
#
# POR QUÉ NO ES "LA WEB":
#
# En modo web (`vite build`) el frontend lleva el motor de Graphite DENTRO del
# wasm, compilado a wasm. En el móvil el motor ya está en el nativo (58 MB de
# `.so`, con Vulkan y PowerVR). Compilarlo otra vez a wasm sería tirar el
# trabajo y perder el rendimiento de GPU.
#
# En modo nativo el wasm es solo la capa de traducción de mensajes: pequeño y
# rápido de compilar. El motor se queda en el nativo y los dos se hablan por
# unos pocos globals de JS (ver más abajo).
#
# LA RECETA ES DE UPSTREAM, NO INVENTADA. `tools/cargo-run/src/frontend.rs`
# hace exactamente esto para el escritorio (`build_wasm_steps`), y
# `frontend/vite.config.ts` ya tiene el modo `native` con su alias de
# `/wrapper/pkg/` a `/wrapper/pkg-native/`.
#
# LA FRONTERA ENTRE JS Y EL MOTOR, en tres globales (medido leyendo el codigo):
#
#   JS -> nativo   window.sendNativeMessage(ArrayBuffer)
#                  Implementado en frontend/wrapper/src/native_communication.rs
#                  (`send_message_to_cef`, que hace `Reflect::get(global,
#                  "sendNativeMessage")`). El cuerpo es un JSON UTF-8; lo
#                  decodifica `desktop::wrapper::deserialize_editor_message`.
#
#   nativo -> JS   window.receiveNativeMessageData = <ArrayBuffer>
#                  window.receiveNativeMessage(window.receiveNativeMessageData)
#                  Exactamente lo que hace `desktop/ui/src/internal/
#                  render_process_handler.rs` con `execute_java_script`.
#
#   arranque       window.initializeNativeCommunication()
#
# El nombre `send_message_to_cef` miente: no es CEF, es "el nativo". Por eso
# esto funciona igual en un WebView.
# ------------------------------------------------------------------

on:
  push:
    branches: [master]
    paths:
      # `android/app/src/main/assets/web/` entero, y no una lista. Aqui viven
      # `index.html` y `bridge.js`, que se COPIAN al paquete del frontend.
      #
      # MEDIDO: arreglar `index.html` (para añadir `type="module"`) no disparo
      # este workflow, porque el filtro no lo cubria y el fichero se creo antes
      # que la regla. `build-apk` bajaba entonces un frontend viejo, sin el
      # atributo, y fallaba contra un commit que ya estaba arreglado.
      #
      # Un filtro que no cubre un fichero no falla: el workflow no corre y el
      # artefacto que se baja el de antes.
      - 'android/app/src/main/assets/web/**'
      - 'frontend/**'
      - 'editor/**'
      - 'node-graph/**'
      - 'document/**'
      - 'libraries/**'
      - 'proc-macros/**'
      - 'demo-artwork/**'
      - '.branding'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # El wrapper del escritorio es dependencia del `frontend/wrapper` (que se
      # compila a wasm aqui). Un cambio suyo cambia el `.so`, asi que la UI
      # tendria que recompilarse para no quedarse con un glue que no encaja.
      - 'desktop/wrapper/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

env:
  WASM_PKG_NAME: graphite_wasm_wrapper

jobs:
  build-frontend:
    name: Frontend Svelte en modo nativo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: graphite-wasm-frontend

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      # ------------------------------------------------------------------
      # ASSETS DE MARCA.
      #
      # `frontend/vite.config.ts` resuelve los iconos a
      # `../branding/<set>/<icono>.svg?raw`, y `branding/` esta en .gitignore:
      # no esta en el repo, se descarga de la URL de `.branding`.
      #
      # Sin este paso el frontend COMPILA pero sale sin un solo icono, que es un
      # fallo silencioso: verde en CI, UI vacia en el movil.
      #
      # El SHA-256 se comprueba contra el del fichero `.branding` del propio
      # repo, no contra uno escrito aqui: asi el pin lo mantiene upstream.
      # ------------------------------------------------------------------
      - name: Fetch branding assets (pinned, SHA-256 verificado)
        run: |
          set -euo pipefail
          URL=$(sed -n '1p' .branding)
          SHA=$(sed -n '2p' .branding)
          echo "  url: $URL"
          echo "  sha256 esperado: $SHA"
          curl -fsSL "$URL" -o /tmp/branding.tar.gz
          REAL=$(sha256sum /tmp/branding.tar.gz | cut -d' ' -f1)
          if [ "$REAL" != "$SHA" ]; then
            echo "::error::SHA-256 del tarball de branding no coincide"
            echo "::error::  esperado: $SHA"
            echo "::error::  obtenido: $REAL"
            exit 1
          fi
          echo "  SHA-256 correcto"
          # El tarball de GitHub tiene un directorio raiz con el sha.
          mkdir -p branding
          tar -xzf /tmp/branding.tar.gz -C branding --strip-components=1
          echo "  contenido:"
          ls branding | head -10
          SVG=$(find branding -name '*.svg' | wc -l)
          echo "  SVG totales: $SVG"
          test "$SVG" -gt 100 || { echo "::error::solo $SVG SVG: el frontend saldra sin iconos"; exit 1; }

      # ------------------------------------------------------------------
      # LAS MISMAS VERSIONES QUE PINEA UPSTREAM, no unas elegidas aqui.
      #
      # `wasm-bindgen` esta pineado a `=0.2.121` en el `Cargo.toml` del
      # workspace, con un aviso de mantenerlo sincronizado con el CLI. Si el CLI
      # no coincide con el crate, el glue sale incompatible y el fallo aparece
      # en el MOVIL, como un error de JS, no en el build.
      #
      # Binaryen va en 130 con SHA-256 por plataforma
      # (`tools/cargo-run/src/requirements/wasm_opt.rs`). Sin ese SHA, un binario
      # de terceros descargado y ejecutado sin verificar es exactamente lo que
      # hace `install-pinned-android-sdk.sh` para el NDK, y esta vez con
      #ejecucion de codigo.
      # ------------------------------------------------------------------
      - name: Install wasm-bindgen-cli and wasm-opt (versiones pineadas por upstream)
        run: |
          set -euo pipefail

          # --- wasm-bindgen-cli 0.2.121 ---
          # Se descarga el binario precompilado en vez de `cargo install`: es el
          # mismo artefacto que publica el proyecto y tarda segundos en vez de
          # varios minutos compilando.
          WBG=0.2.121
          curl -fsSL -o /tmp/wbg.tar.gz \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WBG}/wasm-bindgen-${WBG}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/wbg.tar.gz -C /tmp
          # El tarball trae el binario en la raiz.
          install -m755 "/tmp/wasm-bindgen-${WBG}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

          # --- binaryen 130 ---
          BE=130
          BE_SHA=0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc
          curl -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BE}/binaryen-version_${BE}-x86_64-linux.tar.gz"
          REAL=$(sha256sum /tmp/binaryen.tar.gz | cut -d' ' -f1)
          if [ "$REAL" != "$BE_SHA" ]; then
            echo "::error::SHA-256 de binaryen no coincide"
            echo "::error::  esperado: $BE_SHA"
            echo "::error::  obtenido: $REAL"
            exit 1
          fi
          echo "  SHA-256 de binaryen correcto"
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          # OJO: `$GITHUB_PATH` solo aplica a los pasos SIGUIENTES. Por eso se
          # exporta tambien en este paso —si no, el `wasm-opt --version` de aquí
          # falla con "command not found" aunque el binario este puesto, y parece
          # que falte la herramienta cuando lo que falta es el PATH.
          echo "/tmp/binaryen-version_${BE}/bin" >> "$GITHUB_PATH"
          export PATH="/tmp/binaryen-version_${BE}/bin:$PATH"
          wasm-opt --version

      # ------------------------------------------------------------------
      # EL WASM EN MODO NATIVO.
      #
      # `--no-default-features --features native` es lo importante. Los defaults
      # son `["gpu", "shader-nodes", "web"]`, y `web` arrastra `editor`: el
      # motor entero dentro del wasm. Con `native` y solo `native`, el wasm es
      # unicamente la capa de mensajes.
      # ------------------------------------------------------------------
      - name: Build the wrapper to wasm (native mode)
        run: |
          set -euo pipefail
          cargo build --lib \
            --package graphite-wasm-wrapper \
            --target wasm32-unknown-unknown \
            --release \
            --no-default-features --features native

          WASM=target/wasm32-unknown-unknown/release/graphite_wasm_wrapper.wasm
          test -f "$WASM" || { echo "::error::no se ha compilado $WASM"; exit 1; }
          echo "  wasm: $(stat -c%s "$WASM") bytes"

      - name: Run wasm-bindgen and wasm-opt
        run: |
          set -euo pipefail
          PKG=frontend/wrapper/pkg-native
          mkdir -p "$PKG"
          wasm-bindgen --target web \
            --out-name "$WASM_PKG_NAME" \
            --out-dir "$PKG" \
            --no-demangle \
            target/wasm32-unknown-unknown/release/$WASM_PKG_NAME.wasm
          wasm-opt -O3 -g "$PKG/${WASM_PKG_NAME}_bg.wasm" -o "$PKG/${WASM_PKG_NAME}_bg.wasm"
          echo "  pkg-native:"
          ls -la "$PKG"

          # ------------------------------------------------------------------
          # COMPROBAR QUE VA EN MODO NATIVO. La señal de verdad es el TAMAÑO.
          #
          # MEDIDO: en modo `native` el `.wasm` son 271 KB tras `wasm-opt`. En
          # modo web, con el motor dentro, serían decenas de MB. Es la misma
          # lógica del `.so` del motor: un umbral de tamaño distingue los dos
          # casos mejor que buscar un símbolo.
          # ------------------------------------------------------------------
          W=$(stat -c%s "$PKG/${WASM_PKG_NAME}_bg.wasm")
          echo "  wasm del frontend: $W bytes ($((W / 1024)) KB)"
          if [ "$W" -gt 2000000 ]; then
            echo "::error::el wasm del frontend mide $W bytes."
            echo "::error::Eso significa que el motor se compilo DENTRO del wasm"
            echo "::error::(modo web). En modo native son ~271 KB. El motor ya esta"
            echo "::error::en el .so nativo: duplicarlo solo wastes APK y GPU."
            exit 1
          fi

          # `receiveNativeMessage` es el unico de los tres que el wasm EXPORTA
          # (`#[wasm_bindgen(js_name = ...)]`). Los otros dos no se buscan aqui:
          #
          #   sendNativeMessage             -> lo busca el wasm en `window` con
          #                                    `Reflect::get`, en runtime. No
          #                                    aparece como export.
          #   initializeNativeCommunication -> ni se exporta: lo llama el propio
          #                                    wrapper al arrancar.
          #
          # Comprobar los tres en el glue daria falso negativo, que es como este
          # paso fallo la primera vez.
          if grep -q 'receiveNativeMessage' "$PKG/${WASM_PKG_NAME}.js"; then
            echo "  OK  el glue exporta receiveNativeMessage"
          else
            echo "::error::el glue no exporta receiveNativeMessage"
            exit 1
          fi

      - name: Build the frontend with vite (--mode native)
        run: |
          set -euo pipefail
          cd frontend
          npm ci --include=dev --prefer-offline --no-audit --no-fund
          # `CARGO_TARGET_DIR` lo pone `cargo-run` porque vite lo lee para
          # resolver rutas; se replica aqui.
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            node node_modules/vite/bin/vite.js build --mode native

      - name: Verify the built frontend
        run: |
          set -euo pipefail
          DIST=frontend/dist
          test -d "$DIST" || { echo "::error::no hay $DIST"; exit 1; }
          echo "=== contenido ==="
          ls -la "$DIST"
          echo "=== tamano total ==="
          du -sh "$DIST"

          test -f "$DIST/index.html" || { echo "::error::falta index.html"; exit 1; }

          # El glue del wasm lo BUNDLEA vite, no lo copia.
          #
          # `wasm-loader.ts` hace `import init from "/wrapper/pkg/graphite_wasm_wrapper"`,
          # y en modo native el alias de vite manda ese `/wrapper/pkg/` a
          # `/wrapper/pkg-native/`. Vite resuelve el import, mete el glue en el
          # bundle y emite el `.wasm` como asset CON HASH en `dist/assets/`.
          #
          # MEDIDO: `dist/wrapper/pkg-native` NO existe. Buscarlo ahi da "falta
          # wrapper/pkg-native" aunque el build sea correcto —que es lo que
          # paso, y manda a "arreglar" un build que ya estaba bien.
          FW_FILE=$(find "$DIST" -name 'graphite_wasm_wrapper_bg*.wasm' | head -1)
          if [ -z "$FW_FILE" ]; then
            echo "::error::no hay ningun graphite_wasm_wrapper_bg*.wasm en el dist"
            echo "::error::contenido de dist/assets:"
            ls -la "$DIST/assets" || true
            exit 1
          fi
          echo "  wasm del frontend: $FW_FILE"

          # ------------------------------------------------------------------
          # QUE EL MOTOR NO ESTE DENTRO. Si esta, es que se compiló en modo web
          # y no nativo: el motor dos veces, uno en wasm y otro en el .so, y el
          # del wasm sin GPU nativa. Es el error caro de este paso.
          # ------------------------------------------------------------------
          FW=$(stat -c%s "$FW_FILE")
          echo "  $FW bytes ($((FW / 1024)) KB)"
          if [ "$FW" -gt 2000000 ]; then
            echo "::error::el wasm del dist mide $FW bytes."
            echo "::error::Eso significa que el motor se compiló DENTRO del wasm"
            echo "::error::(modo web). En modo native son ~271 KB. El motor ya esta"
            echo "::error::en el .so nativo: duplicarlo solo wastes APK y GPU."
            exit 1
          fi
          echo "  (el motor NO esta dentro: solo la capa de mensajes)"

          # Los iconos vienen INLINEADOS en el bundle por el alias `?raw` de
          # vite.config.ts, no como ficheros .svg sueltos en el dist. Por eso
          # aquí solo se comprueba que hay alguno (los favicons) y no se espera
          # ninguno en concreto.
          SVG=$(find "$DIST" -name '*.svg' | wc -l)
          echo "  SVG sueltos en el dist: $SVG (favicons; los iconos van inline)"
          test "$SVG" -gt 0 \
            || { echo "::error::cero SVG: faltan los assets de marca"; exit 1; }

          echo "VEREDICTO: el frontend esta compilado en modo nativo"

      # ------------------------------------------------------------------
      # EMPAQUETAR PARA ANDROID
      #
      # Va renombrado a la forma que espera la app, para que el APK no tenga que
      # buscar ficheros con hash en tiempo de ejecucion:
      #
      #   assets/index-<hash>.js  ->  assets/bundle.js
      #
      # El nombre con hash viene de vite y cambia en cada build. Se renombra
      # aqui, una vez, en vez de en el APK.
      #
      # Se incluyen tambien:
      #   - bridge.js, el shim, que NO esta en el dist porque lo escribe el
      #     propio repo y vite no lo conoce.
      #   - index.html, reescrito con `<script src="./bundle.js">`. El del dist
      #     apunta al fichero con hash.
      #
      # NOTA: `index.html` del repo se copia en vez de generarse aqui, para que
      # el fondo negro y el `touch-action` esten versionados y revisables.
      # ------------------------------------------------------------------
      - name: Package the dist for Android
        run: |
          set -euo pipefail
          OUT=frontend-for-android
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # El bundle con hash -> bundle.js
          BUNDLE=$(find frontend/dist/assets -name 'index-*.js' | head -1)
          test -n "$BUNDLE" || { echo "::error::no hay bundle index-*.js en dist/assets"; exit 1; }
          echo "  bundle: $(basename "$BUNDLE")"
          cp "$BUNDLE" "$OUT/bundle.js"

          # El CSS tiene hash tambien, y el bundle lo importa por su nombre.
          # Hay que reescribir la referencia DENTRO del JS, no solo renombrar el
          # fichero: el bundle trae el nombre con hash literal dentro.
          CSS=$(find frontend/dist/assets -name 'index-*.css' | head -1)
          if [ -n "$CSS" ]; then
            CSSNAME=$(basename "$CSS")
            echo "  css: $CSSNAME"
            cp "$CSS" "$OUT/style.css"
            # El bundle referencia el CSS como `assets/<hash>.css` en algunos
            # builds y como `<hash>.css` en otros. Se cubren las dos formas.
            sed -i "s|assets/${CSSNAME}|style.css|g" "$OUT/bundle.js"
            sed -i "s|/${CSSNAME}|/style.css|g" "$OUT/bundle.js"
            sed -i "s|\"${CSSNAME}\"|\"style.css\"|g" "$OUT/bundle.js"
          fi

          # ------------------------------------------------------------------
          # EL WASM, PLANO, EN LA MISMA CARPETA QUE EL INDEX.
          #
          # MEDIDO, dos veces:
          #
          #  1. Con `file://` la referencia del bundle es `/assets/glue.wasm`, con
          #     ruta ABSOLUTA, y el wasm en `assets/web/glue.wasm` no se encontraba:
          #     `file://` resuelve `/` a la raiz del sistema de ficheros.
          #
          #  2. Con `WebViewAssetLoader` el prefijo `/assets/` del handler se
          #     traduce a UNA CARPETA —`assets/web/`—, asi que `/assets/glue.wasm`
          #     se sirve desde `assets/web/glue.wasm`. Con el wasm en un
          #     subdirectorio `assets/` de ahi, el handler no lo encontraba:
          #
          #       error al cargar -1 en .../assets/glue.wasm
          #       Failed to execute 'compile' on 'WebAssembly': HTTP status code
          #       is not ok
          #
          # LA REGLA: todo lo que el bundle pida por ruta absoluta tiene que estar
          # en la MISMA carpeta que el index, porque el prefijo `/assets/` del
          # handler se traduce a esa carpeta. Las miniaturas tambien.
          #
          # El nombre con hash va dentro del glue JS, asi que hay que reescribir
          # las dos formas en que aparece.
          # ------------------------------------------------------------------
          WASM=$(find frontend/dist/assets -name 'graphite_wasm_wrapper_bg-*.wasm' | head -1)
          test -n "$WASM" || { echo "::error::no hay wasm del frontend"; exit 1; }
          echo "  wasm: $(basename "$WASM")"
          cp "$WASM" "$OUT/glue.wasm"
          WASMBASE=$(basename "$WASM")
          sed -i "s|assets/${WASMBASE}|glue.wasm|g" "$OUT/bundle.js"
          sed -i "s|${WASMBASE}|glue.wasm|g" "$OUT/bundle.js"

          cp frontend/dist/index.html "$OUT/index.dist.html"

          # El shim: NO esta en el dist (lo escribe este repo, vite no lo
          # conoce). Se copia desde el repo.
          cp android/app/src/main/assets/web/bridge.js "$OUT/bridge.js"
          cp android/app/src/main/assets/web/index.html "$OUT/index.html"
          # NO se lleva el `WebUI.kt`.
          #
          # MEDIDO: se llevaba, y `build-apk` lo copiaba encima del `.kt` del
          # repo antes de compilar. Con un frontend de un commit ANTERIOR —que es
          # lo que pasa cuando el commit no toca el frontend— eso REVERTIA el
          # Kotlin nuevo con el viejo, y el APK fallaba con errores de hace tres
          # commits:
          #
          #   Unresolved reference 'assetLoader'
          #
          # El shim no tiene nada que ver con el frontend: `bridge.js` esta en el
          # repo y el incrustado lo hace `build-apk`, que es quien tiene el
          # `WebUI.kt` de este commit.

          # `demo-artwork/`: los .graphite que el frontend puede abrir por URL.
          if [ -d frontend/dist/demo-artwork ]; then
            cp -r frontend/dist/demo-artwork "$OUT/demo-artwork"
          fi

          # ------------------------------------------------------------------
          # `dist/assets/`: EL WASM Y LAS MINIATURAS. No entero, pero tampoco
          # solo el wasm.
          #
          # MEDIDO: se copiaba SOLO el wasm, y las miniaturas del arte de demo
          # quedaron fuera. El bundle las pide por ruta ABSOLUTA:
          #
          #     ThumbnailChangingSeasons: `/assets/thumbnail-changing-seasons-<hash>.png`
          #
          # MEDIDO en el APK: CERO ficheros `thumbnail*`. Siete miniaturas que
          # el frontend usa en el menu de bienvenida, desaparecidas en silencio.
          # Ni un error: la ruta simplemente da 404 y sale un hueco.
          #
          # Que las rutas sean absolutas no es casualidad: es la MISMA cosa que
          # hace que el bundle tenga que ser `type="module"`. Con
          # `WebViewAssetLoader` la app sirve por
          # `https://appassets.androidplatform.net/assets/`, y una ruta absoluta
          # resuelve exactamente ahi.
          #
          # Se copian las miniaturas con su nombre con hash. Los ICONOS van
          # inlineados por el alias `?raw` de vite y no hacen falta.
          # ------------------------------------------------------------------
          MINIATURAS=$(find frontend/dist/assets -name 'thumbnail-*.png' | wc -l)
          echo "  miniaturas en dist/assets: $MINIATURAS"
          test "$MINIATURAS" -gt 0 \
            || { echo "::error::no hay miniaturas; el menu de welcome saldra vacio"; exit 1; }
          cp frontend/dist/assets/thumbnail-*.png "$OUT/"

          # Y el resto de `assets/` NO se copia. Al hacerlo aparecia
          #   assets/assets/graphite_wasm_wrapper_bg-<hash>.wasm
          # una COPIA del wasm con el nombre viejo, en un directorio que no usa
          # nadie. El check de `build-apk` lo detecto, que es lo que debe hacer
          # un check, pero el fichero era basura desde el principio.

          echo "=== contenido empaquetado ==="
          ls -la "$OUT"
          echo "=== total ==="
          du -sh "$OUT"

          # Ni una copia de mas. El paquete tiene que ser exactamente lo que la
          # app carga: un indice, el bundle, el css, el wasm, el shim y el arte
          # de demo. Cualquier otra cosa es un fichero que ocupa sitio y no se
          # abre nunca.
          echo "=== que hay, fichero a fichero ==="
          find "$OUT" -type f | sed "s|^$OUT/||" | sort | head -30
          COUNT=$(find "$OUT" -type f | wc -l)
          echo "  $COUNT ficheros"
          test "$COUNT" -lt 25 \
            || { echo "::error::$COUNT ficheros: hay duplicados de mas"; exit 1; }

          # El bundle tiene que citar el wasm en la ruta por la que realmente
          # se va a servir, y el fichero tiene que estar ahi. Con `file://`, una
          # ruta absoluta que no existe es un fallo silencioso: el frontend se
          # queda en negro sin error visible.
          # El bundle esta MINIFICADO en una sola linea de cientos de KB. Un
          # `grep -o '[^"'\'']*glue\.wasm'` se come medio fichero y devuelve
          # 300 bytes de codigo que casualmente contienen esa cadena; el
          # `test -f` posteriorThen falla por un motivo sin relacion. MEDIDO.
          #
          # Lo que importa no es recuperar la ruta: es que el fichero este
          # JUSTO donde apunta. Y la ruta se sabe, es `/assets/glue.wasm`, la que
          # deja el `sed` de arriba. Se comprueba esa, literal.
          grep -q 'assets/glue\.wasm' "$OUT/bundle.js" \
            || { echo "::error::el bundle ya no cita /assets/glue.wasm"; exit 1; }
          # PLANO: el prefijo `/assets/` del handler apunta a esta carpeta, asi que
          # `/assets/glue.wasm` se sirve desde `$OUT/glue.wasm`. MEDIDO: con un
          # subdirectorio `assets/`, el wasm no se encontraba y el frontend
          # moria con "HTTP status code is not ok".
          test -f "$OUT/glue.wasm" \
            || { echo "::error::no existe glue.wasm en la raiz del paquete"; exit 1; }
          # Y las miniaturas, que tambien se piden por ruta absoluta.
          for m in "$OUT"/thumbnail-*.png; do
            test -e "$m" || { echo "::error::no hay miniaturas"; exit 1; }
          done

          # Y que el nombre con hash no quede por ningun sitio: si queda, el sed
          # no hizo su trabajo en alguna de las dos formas que cubre, y el
          # frontend buscara un fichero que no esta.
          HASHNAME=$(basename "$(find frontend/dist/assets -name 'graphite_wasm_wrapper_bg-*.wasm' | head -1)")
          if grep -q "$HASHNAME" "$OUT/bundle.js"; then
            echo "::error::el bundle sigue citando '$HASHNAME', el nombre con hash"
            echo "::error::el frontend buscara ese nombre y no existe"
            exit 1
          fi
          echo "  OK  el wasm esta en assets/ y el hash ya no aparece en el bundle"

          tar -czf frontend-for-android.tar.gz -C "$OUT" .
          ls -la frontend-for-android.tar.gz

      - name: Upload frontend for Android
        uses: actions/upload-artifact@v4
        with:
          name: graphite-mobile-frontend
          path: frontend-for-android.tar.gz
          retention-days: 30
          if-no-files-found: error